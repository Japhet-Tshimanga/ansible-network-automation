---
- name: "Tache 3 - Sauvegarde des running-config"
  hosts: network
  gather_facts: false
  tasks:
    - name: Horodatage unique pour tout le run
      ansible.builtin.set_fact:
        backup_ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
      run_once: true

    - name: Creer le dossier horodate
      ansible.builtin.file:
        path: "{{ playbook_dir }}/backups/{{ backup_ts }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Sauvegarder la running-config
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: "{{ playbook_dir }}/backups/{{ backup_ts }}"
          filename: "{{ inventory_hostname }}.cfg"
