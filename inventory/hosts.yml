            SW1:
              ansible_host: 192.168.56.21
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: cisco
        ansible_ssh_pass: cisco
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: cisco
