---
- name: "Tache 6 - VLANs (switches uniquement)"
  hosts: switches
  gather_facts: false
  tasks:
    - name: Lire les VLANs existants
      cisco.ios.ios_command:
        commands: show vlan brief
      register: vlan_before

    - name: Creer les VLANs manquants depuis la variable 'vlans'
      cisco.ios.ios_config:
        parents: "vlan {{ item.id }}"
        lines:
          - "name {{ item.name }}"
      loop: "{{ vlans }}"
      loop_control:
        label: "VLAN {{ item.id }} - {{ item.name }}"
      when: vlan_before.stdout[0] is not regex('^' ~ item.id | string ~ ' +' ~ item.name ~ ' ', multiline=True)

    - name: Verifier les VLANs
      cisco.ios.ios_command:
        commands: show vlan brief
      register: vlan_check

    - name: Afficher le resultat
      ansible.builtin.debug:
        var: vlan_check.stdout_lines[0]
