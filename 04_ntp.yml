---
- name: "Tache 4 - NTP uniforme"
  hosts: network
  gather_facts: false
  tasks:
    - name: Declarer les serveurs NTP (variable globale ntp_servers)
      cisco.ios.ios_config:
        lines:
          - "ntp server {{ item }}"
      loop: "{{ ntp_servers }}"

    - name: Verifier la configuration NTP
      cisco.ios.ios_command:
        commands: show running-config | include ^ntp server
      register: ntp_check

    - name: Afficher le resultat
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} : {{ ntp_check.stdout_lines[0] }}"
